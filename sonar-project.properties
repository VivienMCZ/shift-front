# SonarQube / SonarCloud analysis for shift-front.
#
# Required CI secrets:
#   SONAR_TOKEN     - analysis token (SonarCloud: My Account > Security)
#   SONAR_HOST_URL  - only for a self-hosted SonarQube Server;
#                     omit it entirely when using SonarCloud.
#
# `sonar.organization` is required by SonarCloud and ignored by SonarQube Server.

sonar.projectKey=VivienMCZ_shift-front
sonar.projectName=shift-front
sonar.organization=vivienmcz

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage produced by `npm run test:coverage` (vitest + v8 -> lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated output and vendored files carry no useful signal.
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  coverage/**,\
  public/**,\
  **/*.config.mjs

# Style tokens only: long literal class strings would otherwise be flagged
# as duplication without telling us anything actionable.
# Aligné sur l'exclusion de couverture de vitest.config.mjs : les `page.js`
# portent le câblage d'assemblage, la logique testable vit dans `lib/` et
# `services/`. Sans cette exclusion, leurs lignes comptent comme non couvertes
# et font chuter la couverture du code neuf sous le seuil du quality gate.
sonar.coverage.exclusions=\
  src/app/layout.js,\
  src/app/**/page.js,\
  src/app/lib/glass-styles.js
