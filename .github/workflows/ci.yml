name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 04:00 UTC: catches a newly published advisory without a push.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the runtime in the Dockerfile (node:22-slim).
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- quality --
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: the repository carries pre-existing violations
      # (react-hooks/set-state-in-effect, no-img-element, no-unescaped-entities).
      # Flip this to a blocking step once that backlog is cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests with coverage
        run: npm run test:coverage

      # Consumed by the sonar job, so the suite runs only once per workflow.
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed. INTERNAL_API_URL is baked into the
      # Next rewrites at build time, so it has to be passed here too.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shift-front:${{ github.sha }}
          build-args: |
            INTERNAL_API_URL=${{ vars.INTERNAL_API_URL || 'http://api:8000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name shift-front -p 3000:3000 shift-front:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "Container answered on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "Container never became ready:"
          docker logs shift-front
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f shift-front || true

  # --------------------------------------------------------------- analysis --
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: test
    # Forked pull requests do not get repository secrets; skip rather than fail.
    if: >-
      github.event_name != 'schedule'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # An undefined repository variable evaluates to an empty string, which the
      # scanner takes literally instead of falling back — hence the explicit
      # default. Set the variable only for a self-hosted SonarQube Server.
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - name: Check for a Sonar token
        id: token
        # The secrets context is not available in a job-level `if`, so the
        # steps are guarded individually instead.
        run: echo "present=${{ env.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.token.outputs.present != 'true'
        run: echo "::notice::SONAR_TOKEN is not set - skipping the SonarQube analysis."

      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
        with:
          # Sonar needs the full history to attribute blame and new-code periods.
          fetch-depth: 0

      - name: Download coverage
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: SonarQube scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v6

      # Fails the job when the project's quality gate is red.
      - name: Quality gate
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Static analysis: covers the OWASP injection, path traversal, SSRF and
    # unsafe-DOM families that npm audit cannot see, since audit only knows
    # about published advisories in dependencies.
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Adds the OWASP-oriented rules on top of the default set.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  # ----------------------------------------------------------- dependencies --
  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Blocking: anything moderate or worse fails the job.
      - name: npm audit
        run: npm audit --audit-level=moderate

      # Flags vulnerable or badly licensed packages a PR would introduce.
      # Requires GitHub's Dependency graph, which is off on this repository:
      #   Settings > Security > Code security > Dependency graph
      # Until it is enabled the action errors out, so it must not sink the job.
      # npm audit above already blocks on known advisories.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

      - name: Report outdated packages
        if: always()
        run: |
          echo '## Outdated packages' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # `npm outdated` exits 1 when anything is outdated; informational here.
          npm outdated >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
