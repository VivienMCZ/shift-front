version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine patch/minor churn, so the noise stays low.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # React is pinned to an exact version in package.json; majors need a
      # deliberate migration rather than an automated bump.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Action bumps are reviewed together: one PR, one CI run.
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The base image tracks an LTS line. Node majors reach LTS only in the
      # October after their release, so an automated major bump would put a
      # non-LTS runtime in production. Move the line by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
