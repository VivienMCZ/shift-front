name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonar:
    name: Analysis
    runs-on: ubuntu-latest
    # Forked pull requests do not get repository secrets; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar needs the full history to attribute blame and new-code periods.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The scanner reads coverage/lcov.info, so the tests must run here.
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Leave SONAR_HOST_URL unset for SonarCloud; set the repository
          # variable for a self-hosted SonarQube Server.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # Fails the job when the project's quality gate is red.
      - name: Quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
